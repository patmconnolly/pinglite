;Configuration for the main check.
[CHECK]
HOST=https://download.pinglite.xyz ;The target you are checking.

[VALIDATION]
RETURNCODE=200 ;What you are expecting as a return code.

SSLVALID=1 ;Weather to report failure if SSL certificate is invalid or nonexistant.
; 0 - Do not report if SSL is invalid.
; 0 - Do not report if SSL cert is nonexistant (http).
; 1 - Report if SSL cert is invalid or nonexistant (http).

SSLEXPIRYREMINDER=30 ;How many days before SSL expiry to notify. (https only)


[REPORTING]
LOGFILE=/dev/null
; Location of the log file.
; Defaults to ./pinglite.log
; Specify exact file name
;  - e.g. /var/log/pinglite.txt
; User running the command needs permission to the file.
; If file does not exist, user needs permission to directory.

RESULTS=pinglite.results.ini
; Location of the results file.
; REQUIRED if METHOD is NOT NONE or RETCODE.
; Specify exact file name
;  - e.g. /opt/pinglite/results.ini
; User running the command needs permission to the file.
; If file does not exist, user needs permission to directory.

METHOD=API
; Options as follows, more to be added in the future.
; *- Options will not take into account any configured record file.
; ---------------------------------------------------
; NONE    *- STDOUT only. - DEFAULT
; RETCODE *- Returns 1 on failure of program or validation. See STDOUT and STDERR for reason.
; API     *- Sends API call based on configured information.
; 

SSLEXPIRYSNOOZE=1 ;How many days after previous alert to remind you SSL cert is expiring soon.
; Reverts to standard alert once expires.

ALERTSNOOZE=30 ;How many minutes after previous alert to wait before alerting again. 

[API]
URL=httpx://nowhere                                     ;URL to send API call to.
HEADERS="Content-Type: application/json; cahrset=utf-8" ;Headers for the API call. Quotes can be used for headers containing semicolons.
PAYLOAD=templates/payload.json                          ;Location of JSON file for payload.
